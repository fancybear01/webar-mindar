<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Image tracking — MindAR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      AFRAME.registerComponent('tracking-status', {
        init() {
          const message = document.querySelector('#tracking-message');
          this.el.addEventListener('targetFound', () => message.textContent = 'Маркер найден — модель отображается');
          this.el.addEventListener('targetLost', () => message.textContent = 'Наведите камеру на маркер');
        }
      });
    </script>
  </head>
  <body class="ar-page">
    <a class="back floating" href="index.html">← Назад</a>
    <p id="tracking-message" class="tracking-message">Разрешите доступ к камере и наведите её на маркер</p>
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-assets timeout="15000"><a-asset-item id="pyramid" src="assets/pyramid.gltf?v=2"></a-asset-item></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" tracking-status>
        <a-light type="ambient" color="#ffffff" intensity="1.1"></a-light>
        <a-light type="directional" color="#fff4dc" intensity="1.4" position="1 2 2"></a-light>
        <a-gltf-model src="#pyramid" position="0 0.2 0" rotation="-90 0 0" scale="0.6 0.6 0.6"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
