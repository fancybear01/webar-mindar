<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>Управление объектом и HDRI — задание 5</title>
  <link rel="stylesheet" href="styles.css?v=20261022">
  <link rel="stylesheet" href="task5.css?v=20261022">
  <script type="importmap">{"imports":{"three":"./vendor/three-0.160.0.module.js"}}</script>
</head>
<body class="controls-page">
  <div id="controls-overlay" class="controls-overlay">
    <a class="back floating" href="index.html">← К заданиям</a>
    <div class="controls-heading"><span class="eyebrow">Задание 5</span><h1>Объект под вашим управлением</h1><span id="lighting-status">Загружаем HDRI…</span></div>
    <section class="control-panel" aria-label="Управление 3D-объектом">
      <p id="controls-status" role="status" aria-live="polite">Готовим 3D-просмотр…</p>
      <div class="control-actions">
        <button id="controls-start" disabled>Начать AR</button>
        <button id="controls-place" hidden disabled>Поставить объект</button>
        <button id="controls-end" hidden>Выйти из AR</button>
      </div>
      <details id="object-controls" open>
        <summary>Настроить объект</summary>
        <div class="control-grid">
          <label>Модель<select id="object-model"><option value="cube">Куб</option><option value="pyramid">Пирамида · glTF</option><option value="knot">Узел</option></select></label>
          <label>Цвет<input id="object-color" type="color" value="#f0ad39"></label>
          <div class="rotation-controls"><span>Поворот: <output id="rotation-value">0°</output></span><div><button id="rotate-left" aria-label="Повернуть влево">−15°</button><button id="rotate-right" aria-label="Повернуть вправо">+15°</button><button id="rotate-reset">Сброс</button></div></div>
          <label>Металличность <output id="metalness-value">0.25</output><input id="object-metalness" type="range" min="0" max="1" step="0.05" value="0.25"></label>
          <label>Шероховатость <output id="roughness-value">0.4</output><input id="object-roughness" type="range" min="0.05" max="1" step="0.05" value="0.4"></label>
        </div>
      </details>
      <p class="controls-help">В AR найдите поверхность и поставьте объект по зелёному кольцу. Цвет, модель и поворот можно менять после размещения.</p>
    </section>
  </div>
  <script type="module" src="modules/task5/main.js?v=20261022"></script>
</body>
</html>
